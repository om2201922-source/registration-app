<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- استدعاء مكتبة تيليجرام لتطبيقات الويب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>تعديل بياناتي</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header img {
            width: 100px; /* يمكنك وضع رابط لوجو البوت الخاص بك هنا */
            border-radius: 50%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        label span { color: red; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: #2c2c2c;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid #ff0000;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .close-btn {
            background-color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>تعديل بياناتي ✏️</h2>
    </div>

    <div class="form-group">
        <label>الاسم الكامل <span>*</span></label>
        <input type="text" id="name" placeholder="عمر محمد محمود" required>
    </div>

    <div class="form-group">
        <label>البريد الإلكتروني <span>*</span></label>
        <input type="email" id="email" placeholder="om229877@gmail.com" required>
    </div>

    <div class="form-group">
        <label>رقم الهاتف (مع رمز الدولة) <span>*</span></label>
        <input type="tel" id="phone" placeholder="01210115226" required>
    </div>

    <button onclick="submitData()">تحديث</button>
    <button class="close-btn" onclick="Telegram.WebApp.close()">إغلاق</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // لجعل النافذة تملأ الشاشة

        function submitData() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;

            if(!name || !email || !phone) {
                tg.showAlert("⚠️ الرجاء ملء جميع الحقول المطلوبة!");
                return;
            }

            // تجميع البيانات لإرسالها للبوت
            let data = {
                name: name,
                email: email,
                phone: phone
            };

            // إرسال البيانات للبوت وإغلاق النافذة
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
